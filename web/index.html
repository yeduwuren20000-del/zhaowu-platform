<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开发与服务器管理工作台</title>
    <style>
      /* 首屏骨架：React 接管前（实测 60~180ms）先给一个"正在起来"的样子，
         而不是一片深色空白。没有它，用户看到的是黑屏。 */
      html, body { margin: 0; height: 100%; background: #0c0e11; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #7d8590;
      }
      #boot .mark {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        font-weight: 600;
        color: #e6e9ee;
      }
      #boot .dot {
        width: 22px; height: 22px;
        border-radius: 5px;
        background: #4c8dfd;
      }
      #boot .bar {
        width: 132px; height: 3px;
        border-radius: 2px;
        background: #1b1f26;
        overflow: hidden;
      }
      #boot .bar i {
        display: block; width: 40%; height: 100%;
        background: #4c8dfd;
        animation: boot-slide 1.05s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      #boot .hint { font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="mark"><span class="dot"></span>开发与服务器管理工作台</div>
      <div class="bar"><i></i></div>
      <div class="hint">正在启动…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
